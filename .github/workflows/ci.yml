name: CI

# Every push to main, and every pull request into it: the unit tests, then the packages built the way the release
# builds them (Release, all heads), without publishing anything. Toolchain pins match release.yml - bump them together.
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

# a newer push to the same branch / PR makes the running build pointless
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_VERSION: 11.0.x
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      # plain net11.0 - no workload. The UI tests drive the Sample app on a device, so they stay local.
      - name: Unit tests
        run: dotnet test tests/Shiny.Maui.Shell.Tests -c Release

  build:
    # Windows so the windows10.0.19041.0 head is part of the build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          workloads: maui, macos

      - name: Build
        run: dotnet build Build.slnf /restore -m -c Release
